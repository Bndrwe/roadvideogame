<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Road</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#080808;--surface:#111;--surface2:#181818;--border:#1e1e1e;
  --text:#ffffff;--dim:#888888;--bright:#ffffff;
  --health:#6a3a3a;--health-bg:#1e0e0e;
  --hunger:#6a5a3a;--hunger-bg:#1e1a0e;
  --thirst:#3a4a6a;--thirst-bg:#0e141e;
  --sanity:#3a6a4a;--sanity-bg:#0e1e12;
  --danger:#7a3333;--good:#3a6a3a;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Courier Prime','Courier New',monospace;font-size:14px;line-height:1.7;overflow-x:hidden}
.screen{display:none!important}
.screen.active{display:flex!important}

/* ── TITLE ── */
#title-screen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px 20px;text-align:center;background:var(--bg)}
#title-art{width:100%;max-width:680px;margin-bottom:32px}
.game-title{font-family:'Special Elite',serif;font-size:clamp(52px,12vw,110px);letter-spacing:.35em;color:#a8a8a8;text-transform:uppercase;margin-bottom:6px;text-shadow:0 0 60px rgba(0,0,0,.9)}
.game-sub{font-size:12px;letter-spacing:.5em;color:var(--dim);text-transform:uppercase;margin-bottom:52px;font-style:italic}
#start-btn{background:transparent;border:1px solid #333;color:var(--dim);font-family:'Special Elite',serif;font-size:14px;letter-spacing:.35em;padding:14px 56px;cursor:pointer;text-transform:uppercase;transition:all .4s}
#start-btn:hover{border-color:#666;color:var(--text)}

/* ── INTRO ── */
#intro-screen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 40px;background:#000}
#intro-text{max-width:520px;font-size:16px;line-height:2.1;color:#ffffff;font-style:italic;white-space:pre-wrap}

#intro-continue-btn{display:none;margin-top:28px;background:transparent;border:1px solid #333;color:var(--text);font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.25em;padding:12px 28px;cursor:pointer;text-transform:uppercase;transition:all .25s}
#intro-continue-btn:hover{border-color:#666;color:#fff}


/* ── GAME ── */
#game-screen{flex-direction:column;height:100vh;max-width:980px;margin:0 auto;width:100%;overflow:hidden}
#scene-wrap{position:relative;border-bottom:1px solid var(--border);flex-shrink:0;background:#050505}
#scene-svg{width:100%;display:block;max-height:260px}
#day-badge{position:absolute;top:12px;left:16px;font-family:'Special Elite',serif;font-size:12px;letter-spacing:.2em;color:var(--dim)}
#weather-badge{position:absolute;top:12px;right:16px;font-size:11px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase}
#mid-row{display:grid;grid-template-columns:1fr 240px;flex:1;min-height:0;overflow:hidden}
#narrative-col{padding:24px 28px;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
#narrative-text{font-size:14px;line-height:1.9;color:var(--text);min-height:90px;white-space:pre-wrap;flex:1;margin-bottom:20px}
#result-text{font-size:13px;color:var(--dim);font-style:italic;border-left:2px solid #222;padding:10px 14px;margin-bottom:16px;line-height:1.8;display:none;white-space:pre-wrap}
#choices-list{display:flex;flex-direction:column;gap:1px;margin-top:12px;}
.choice-btn{background:transparent;border:none;border-left:2px solid #1e1e1e;color:var(--dim);font-family:'Courier Prime',monospace;font-size:13px;text-align:left;padding:9px 14px;cursor:pointer;transition:all .2s;line-height:1.5}
.choice-btn:hover:not(.locked){border-left-color:#555;color:var(--text);background:rgba(255,255,255,.015)}
.choice-btn.locked{opacity:.3;cursor:not-allowed}
.req-note{font-size:10px;color:var(--danger);margin-left:4px;letter-spacing:.05em}
#continue-btn{background:transparent;border:none;border-left:2px solid #333;color:var(--dim);font-family:'Courier Prime',monospace;font-size:12px;letter-spacing:.2em;text-align:left;padding:9px 14px;cursor:pointer;transition:all .2s;text-transform:uppercase;display:none;margin-top:8px}
#continue-btn:hover{border-left-color:#666;color:var(--text)}
#status-line{font-size:11px;color:var(--dim);margin-top:10px;min-height:16px;letter-spacing:.05em}
.status-warn{color:var(--danger)!important}
.status-ok{color:var(--good)!important}

/* ── STATS ── */
#stats-col{padding:140px 16px 20px;background:var(--surface);display:block;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;overscroll-behavior:contain}
.char-block{margin-bottom:16px}
.char-block h3{font-family:'Special Elite',serif;font-size:10px;letter-spacing:.35em;color:var(--dim);text-transform:uppercase;margin-bottom:12px}
.stat-row{margin-bottom:8px}
.stat-lbl{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase;margin-bottom:3px}
.stat-num{font-variant-numeric:tabular-nums}
.bar-bg{height:3px;border-radius:2px}
.bar-fill{height:100%;border-radius:2px;transition:width .6s ease}
.bar-bg.hp{background:var(--health-bg)}.bar-fill.hp{background:var(--health)}
.bar-bg.hu{background:var(--hunger-bg)}.bar-fill.hu{background:var(--hunger)}
.bar-bg.th{background:var(--thirst-bg)}.bar-fill.th{background:var(--thirst)}
.bar-bg.sa{background:var(--sanity-bg)}.bar-fill.sa{background:var(--sanity)}
.bar-fill.crit{animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.char-divider{height:1px;background:var(--border);margin:8px 0 16px}
#karma-block{margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
#karma-block .klbl{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px}
#karma-text{font-family:'Special Elite',serif;font-size:12px;color:var(--dim);font-style:italic}
#supply-btns{margin-top:16px;display:flex;flex-direction:column;gap:4px}
.sup-btn{background:transparent;border:1px solid #1e1e1e;color:#888888;font-family:'Courier Prime',monospace;font-size:11px;padding:6px 10px;cursor:pointer;text-align:center;transition:all .2s;letter-spacing:.05em;width:100%;margin-bottom:4px;}
.sup-btn:hover{color:#ffffff; border-color:#666666;}
.sup-btn:hover:not(:disabled){border-color:#444;color:var(--text)}
.sup-btn:disabled{opacity:.2;cursor:not-allowed}

/* ── INVENTORY ── */
#inv-bar{border-top:1px solid var(--border);padding:10px 28px;display:flex;gap:24px;align-items:center;background:var(--surface);flex-shrink:0;flex-wrap:wrap}
.inv-lbl{font-size:10px;letter-spacing:.25em;color:var(--dim);text-transform:uppercase;margin-right:4px}
.inv-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim)}
.inv-ct{font-family:'Special Elite',serif;font-size:14px}
#progress-bar-wrap{margin-left:auto;display:flex;align-items:center;gap:10px}
#prog-lbl{font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase}
#prog-bar-bg{width:80px;height:2px;background:#1a1a1a;border-radius:1px}
#prog-bar-fill{height:100%;border-radius:1px;background:#3a3a3a;transition:width .6s ease}

/* ── CUTSCENE ── */
#cutscene-screen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 40px;background:#050505;text-align:left}
#cutscene-svg-wrap{width:100%;max-width:680px;margin-bottom:36px}
#cutscene-text{max-width:540px;font-size:15px;line-height:2.1;color:#888;font-style:italic;white-space:pre-wrap}
#cutscene-btn{margin-top:40px;background:transparent;border:none;color:var(--dim);font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;cursor:pointer;text-transform:uppercase;opacity:0;transition:opacity .8s;padding:0}
#cutscene-btn.show{opacity:1}
#cutscene-btn:hover{color:var(--text)}

/* ── SECRET CUTSCENE ── */
#secret-cutscene-screen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:60px 40px;background:#050505;text-align:left}
#secret-cutscene-svg-wrap{width:100%;max-width:680px;margin-bottom:36px}
#secret-cutscene-text{max-width:540px;font-size:15px;line-height:2.1;color:#888;font-style:italic;white-space:pre-wrap}
#secret-cutscene-btn{margin-top:40px;background:transparent;border:none;color:var(--dim);font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.35em;cursor:pointer;text-transform:uppercase;opacity:0;transition:opacity .8s;padding:0}
#secret-cutscene-btn.show{opacity:1}
#secret-cutscene-btn:hover{color:var(--text)}

/* ── DEATH ── */
#death-screen{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#000;text-align:center; transition: opacity 2s; opacity: 1; z-index: 100}
#death-text{font-family:'Special Elite',serif;font-size:clamp(18px,4vw,34px);color:#3a3a3a;letter-spacing:.2em;opacity:0;transition:opacity 2.5s}
#death-text.show{opacity:1}

/* ── SUMMARY ── */
#summary-screen{flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;padding:60px 40px;background:var(--bg);text-align:center;overflow-y:auto}
#sum-title{font-family:'Special Elite',serif;font-size:12px;letter-spacing:.4em;color:var(--dim);text-transform:uppercase;margin-bottom:48px}
.sum-row{display:flex;justify-content:space-between;width:300px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.sum-key{color:var(--dim);letter-spacing:.08em;text-align:left}
.sum-val{font-family:'Special Elite',serif;color:var(--text);text-align:right}
#ending-text{max-width:480px;margin-top:44px;font-style:italic;color:var(--dim);font-size:14px;line-height:2.1;text-align:center}
#secret-ending{display:none;max-width:480px;margin-top:32px;font-style:italic;color:var(--dim);font-size:14px;line-height:2.2;text-align:left;padding-top:32px;border-top:1px solid var(--border)}
#again-btn{margin-top:56px;background:transparent;border:1px solid #2a2a2a;color:var(--dim);font-family:'Special Elite',serif;font-size:13px;letter-spacing:.3em;padding:12px 40px;cursor:pointer;text-transform:uppercase;transition:all .3s}
#again-btn:hover{border-color:#555;color:var(--text)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.fi{animation:fadeIn .8s ease forwards}

#ash-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.6;
}

#vignette {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 9000;
  box-shadow: inset 0 0 0 0 rgba(100,0,0,0);
  transition: box-shadow 1s ease;
}
.health-low #vignette {
  box-shadow: inset 0 0 150px 20px rgba(100,0,0,0.4);
}

/* SVG ANIMATIONS */
@keyframes fallRain {
  0% { transform: translate(0, -20px); opacity: 0; }
  20% { opacity: .55; }
  100% { transform: translate(15px, 200px); opacity: 0; }
}
@keyframes fallSnow {
  0% { transform: translate(0, -20px); opacity: 0; }
  20% { opacity: .5; }
  100% { transform: translate(-10px, 150px); opacity: 0; }
}
.rain-drop { animation: fallRain linear infinite; }
.snow-flake { animation: fallSnow linear infinite; }
@keyframes floatSky {
  0% { opacity: 0.8; }
  50% { opacity: 1; }
  100% { opacity: 0.8; }
}
#sg { animation: floatSky 10s ease-in-out infinite; }


@keyframes driftAsh {
  0% { transform: translate(0, 0); opacity: 0; }
  10% { opacity: 0.6; }
  90% { opacity: 0.6; }
  100% { transform: translate(30px, 120px); opacity: 0; }
}
.ash-particle { animation: driftAsh linear infinite; }


/* Action animations */
@keyframes walkBob {
  0% { transform: translateY(0px) translateX(0px); }
  25% { transform: translateY(-2px) translateX(1px); }
  50% { transform: translateY(0px) translateX(2px); }
  75% { transform: translateY(-2px) translateX(1px); }
  100% { transform: translateY(0px) translateX(0px); }
}
@keyframes eatBob {
  0% { transform: translateY(0px) scale(1); }
  50% { transform: translateY(-3px) scale(1.03); }
  100% { transform: translateY(0px) scale(1); }
}
@keyframes drinkTilt {
  0% { transform: rotate(0deg) translateY(0px); }
  35% { transform: rotate(-4deg) translateY(-2px); }
  70% { transform: rotate(2deg) translateY(-1px); }
  100% { transform: rotate(0deg) translateY(0px); }
}
@keyframes healPulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.06); opacity: .82; }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes cartRoll {
  0% { transform: translateX(0px); }
  50% { transform: translateX(2px); }
  100% { transform: translateX(0px); }
}
#scene-svg svg .svg-figure,
#scene-svg svg .cart-figure {
  transform-box: fill-box;
  transform-origin: center bottom;
  will-change: transform, opacity;
}
#scene-svg svg .walk { animation: walkBob .45s ease-in-out 4; }
#scene-svg svg .eat { animation: eatBob .45s ease-in-out 3; }
#scene-svg svg .drink { animation: drinkTilt .6s ease-in-out 3; }
#scene-svg svg .heal { animation: healPulse .7s ease-in-out 2; }
#scene-svg svg .cart-walk { animation: cartRoll .45s ease-in-out 4; }


#skip-intro-btn { position: absolute; top: 20px; right: 20px; background: transparent; border: 1px solid var(--border); color: var(--dim); font-family: 'Courier Prime', monospace; font-size: 12px; padding: 6px 12px; cursor: pointer; text-transform: uppercase; transition: color 0.3s; }
#skip-intro-btn:hover { color: var(--text); border-color: #666; }
</style>
</head>
<body>
<div id="vignette"></div>

<!-- TITLE -->
<div id="title-screen" class="screen active">
  <div id="title-art"></div>
  <h1 class="game-title">The Road</h1>
  <p class="game-sub">Carry the fire.</p>
  <button id="start-btn">Begin</button>
</div>

<!-- INTRO -->
<div id="intro-screen" class="screen" style="position:relative;">
  <button id="skip-intro-btn">Skip</button>
  <div id="intro-text"></div>
  <button id="intro-continue-btn">Continue</button>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div id="scene-wrap">
    <div id="scene-svg"></div>
    <span id="day-badge">Day 1</span>
    <span id="weather-badge">Overcast</span>
  </div>
  <div id="mid-row">
    <div id="narrative-col">
      <div id="narrative-text"></div>
      <div id="result-text"></div>
      <div id="choices-list"></div>
      <button id="continue-btn">— continue —</button>
      <div id="status-line"></div>
    </div>
    <div id="stats-col">
      <div class="char-block">
        <h3>The Man (You)</h3>
        <div class="stat-row"><div class="stat-lbl"><span>Health</span><span class="stat-num" id="m-hp-n">80</span></div><div class="bar-bg hp"><div class="bar-fill hp" id="m-hp-b" style="width:80%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Hunger</span><span class="stat-num" id="m-hu-n">70</span></div><div class="bar-bg hu"><div class="bar-fill hu" id="m-hu-b" style="width:70%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Thirst</span><span class="stat-num" id="m-th-n">70</span></div><div class="bar-bg th"><div class="bar-fill th" id="m-th-b" style="width:70%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Sanity</span><span class="stat-num" id="m-sa-n">90</span></div><div class="bar-bg sa"><div class="bar-fill sa" id="m-sa-b" style="width:90%"></div></div></div>
      </div>
      <div class="char-divider"></div>
      <div class="char-block">
        <h3>The Boy (Your Son)</h3>
        <div class="stat-row"><div class="stat-lbl"><span>Health</span><span class="stat-num" id="b-hp-n">85</span></div><div class="bar-bg hp"><div class="bar-fill hp" id="b-hp-b" style="width:85%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Hunger</span><span class="stat-num" id="b-hu-n">75</span></div><div class="bar-bg hu"><div class="bar-fill hu" id="b-hu-b" style="width:75%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Thirst</span><span class="stat-num" id="b-th-n">75</span></div><div class="bar-bg th"><div class="bar-fill th" id="b-th-b" style="width:75%"></div></div></div>
        <div class="stat-row"><div class="stat-lbl"><span>Sanity</span><span class="stat-num" id="b-sa-n">80</span></div><div class="bar-bg sa"><div class="bar-fill sa" id="b-sa-b" style="width:80%"></div></div></div>
      </div>
      <div id="karma-block">
        <div class="klbl">Karma</div>
        <div id="karma-text">Uncertain</div>
      </div>
      <div id="supply-btns">
        <button class="sup-btn" id="btn-eat" onclick="useSupply('food','man')">Give Food to Man (-1 Food)</button>
        <button class="sup-btn" id="btn-drink" onclick="useSupply('water','man')">Give Water to Man (-1 Water)</button>
        <button class="sup-btn" id="btn-feed" onclick="useSupply('food','boy')">Give Food to Boy (-1 Food)</button>
        <button class="sup-btn" id="btn-water-boy" onclick="useSupply('water','boy')">Give Water to Boy (-1 Water)</button>
        <button class="sup-btn" id="btn-heal-m" onclick="useSupply('medicine','man')">Give Meds to Man (-1 Meds)</button>
        <button class="sup-btn" id="btn-heal-b" onclick="useSupply('medicine','boy')">Give Meds to Boy (-1 Meds)</button>
      </div>
    </div>
  </div>
  <div id="inv-bar">
    <span class="inv-lbl">Supplies</span>
    <span class="inv-item">🥫 <span class="inv-ct" id="i-food">3</span></span>
    <span class="inv-item">💧 <span class="inv-ct" id="i-water">2</span></span>
    <span class="inv-item">💊 <span class="inv-ct" id="i-med">1</span></span>
    <span class="inv-item">🔫 <span class="inv-ct" id="i-ammo">6</span></span>
    <span class="inv-item">🎇 <span class="inv-ct" id="i-flare">1</span></span>
    <div id="progress-bar-wrap">
      <span id="prog-lbl">To Coast</span>
      <div id="prog-bar-bg"><div id="prog-bar-fill" style="width:0%"></div></div>
    </div>
  </div>
</div>

<!-- CUTSCENE -->
<div id="cutscene-screen" class="screen">
  <div id="cutscene-svg-wrap"></div>
  <div id="cutscene-text"></div>
  <button id="cutscene-btn">— continue —</button>
</div>

<!-- SECRET CUTSCENE -->
<div id="secret-cutscene-screen" class="screen">
  <div id="secret-cutscene-svg-wrap"></div>
  <div id="secret-cutscene-text"></div>
  <button id="secret-cutscene-btn">— continue —</button>
</div>

<!-- DEATH -->
<div id="death-screen" class="screen">
  <div id="death-text"></div>
</div>

<!-- SUMMARY -->
<div id="summary-screen" class="screen">
  <div id="sum-title">End of the Road</div>
  <div id="sum-stats"></div>
  <div id="ending-text"></div>
  <div id="secret-ending"></div>
  <button id="again-btn" onclick="location.reload()">Play Again</button>
</div>

<script>
// ═══════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════
const G = {
  day: 1,
  man: {hp:80, hu:70, th:70, sa:90},
  boy: {hp:85, hu:75, th:75, sa:80},
  inv: {food:3, water:2, medicine:1, bullets:6, flare:1},
  karma: 50,
  progress: 0,
  reachedCoast: false,
  coastScene: false,
  over: false,
  deathWho: null,
  weather: 'overcast',
  scene: 'road',
  usedEvents: new Set(),
  lastEvent: null,
  supplyUsedThisTurn: false,
  awaitingContinue: false,
  sceneAction: 'idle',
  actionTarget: 'both',
  actionTimer: null,
  arrowShot: false
};

const clamp = (v,mn=0,mx=100) => Math.max(mn, Math.min(mx, v));
const pct = v => clamp(Math.round(v));

// ═══════════════════════════════════════════════
//  SVG SCENES
// ═══════════════════════════════════════════════
function tree(x, y, s) {
  const h = 44*s, w = 18*s;
  return `<g transform="translate(${x},${y})" stroke="#1a1a1a" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="${-h}" stroke-width="${1.8*s}"/>
    <line x1="0" y1="${-h*.55}" x2="${-w*.7}" y2="${-h*.88}" stroke-width="${s}"/>
    <line x1="0" y1="${-h*.55}" x2="${w*.55}" y2="${-h*.8}" stroke-width="${s}"/>
    <line x1="0" y1="${-h*.38}" x2="${-w*.45}" y2="${-h*.6}" stroke-width="${s*.8}"/>
    <line x1="0" y1="${-h*.28}" x2="${w*.35}" y2="${-h*.48}" stroke-width="${s*.7}"/>
    <line x1="0" y1="${-h*.72}" x2="${-w*.3}" y2="${-h*.95}" stroke-width="${s*.6}"/>
  </g>`;
}

function figures(cx, by, scale=1, action='idle', target='both') {
  const s = scale;
  const tMan = target==='man' || target==='both';
  const tBoy = target==='boy' || target==='both';
  const manClass = `svg-figure man-figure ${tMan && action!=='idle' ? action : ''}`.trim();
  const boyClass = `svg-figure boy-figure ${tBoy && action!=='idle' ? action : ''}`.trim();

function rain(w, h) {
  let r = '<g class="weather-group">';
  for(let i=0;i<65;i++){
    const x=Math.random()*w, y=Math.random()*h - 100; // Start higher
    const delay = Math.random()*2;
    const dur = 0.5 + Math.random()*0.5;
    r += `<line class="rain-drop" x1="${x}" y1="${y}" x2="${x+1.5}" y2="${y+8}" stroke="#2e3e50" stroke-width="1" opacity=".55" style="animation-delay:-${delay}s; animation-duration:${dur}s"/>`;
  }
  return r + '</g>';
}

function snow(w, h) {
  let s = '<g class="weather-group">';
  for(let i=0;i<60;i++){
    const x=Math.random()*w, y=Math.random()*h - 50; // Start higher
    const delay = Math.random()*5;
    const dur = 2 + Math.random()*3;
    s += `<circle class="snow-flake" cx="${x}" cy="${y}" r="1.8" fill="#8a8a8a" opacity=".5" style="animation-delay:-${delay}s; animation-duration:${dur}s"/>`;
  }
  return s + '</g>';
}

function drawAsh(w, h) {
  let a = '<g class="ash-layer" style="pointer-events:none;">';
  for(let i=0;i<40;i++) {
    const x = Math.random()*w;
    const y = Math.random()*h - 50;
    const delay = Math.random()*8;
    const dur = 4 + Math.random()*6;
    const size = 0.5 + Math.random()*1.5;
    a += `<circle class="ash-particle" cx="${x}" cy="${y}" r="${size}" fill="#aaaaaa" opacity="0.6" style="animation-delay:-${delay}s; animation-duration:${dur}s"/>`;
  }
  return a + '</g>';
}

function drawRoad(weather='overcast') {
  const W=700, H=260, cx=W/2, hor=H*.44;
  const sky = weather==='snow' ? ['#555','#7a7a7a'] : weather==='rain' ? ['#1e1e1e','#2a2a2a'] : ['#2a2a2a','#484848'];
  const gnd = weather==='snow' ? '#444' : '#1a1a1a';
  const road = weather==='rain' ? '#111' : '#161616';
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${sky[0]}"/><stop offset="100%" stop-color="${sky[1]}"/></linearGradient>
    <linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${gnd}"/><stop offset="100%" stop-color="#0a0a0a"/></linearGradient>
  </defs>
  <rect x="0" y="0" width="${W}" height="${hor}" fill="url(#sg)"/>
  <rect x="0" y="${hor}" width="${W}" height="${H-hor}" fill="url(#gg)"/>
  <polygon points="${cx-18},${hor} ${cx+18},${hor} ${W*.78},${H} ${W*.22},${H}" fill="${road}"/>
  <line x1="${cx}" y1="${hor+4}" x2="${cx}" y2="${H}" stroke="#2a2a2a" stroke-width="1" stroke-dasharray="9,13"/>`;
  // trees
  for(let i=0;i<5;i++){
    const t=i/4.5, x=cx-28-t*(cx-55), y=hor+t*(H-hor), sc=.28+t*.75;
    s += tree(x, y, sc);
  }
  for(let i=0;i<5;i++){
    const t=i/4.5, x=cx+28+t*(cx-55), y=hor+t*(H-hor), sc=.28+t*.75;
    s += tree(x, y, sc);
  }
  s += figures(cx, H, 1, G.sceneAction || 'idle', G.actionTarget || 'both');
  if(weather==='rain') s += rain(W,H);
  if(weather==='snow') s += snow(W,H);
  s += '</svg>';
  return s;
}

function getSceneSVG() {
  let svg = '';
  if (G.scene === 'house') svg = drawHouse();
  else if (G.scene === 'bunker') svg = drawBunker();
  else if (G.scene === 'river') svg = drawRiver();
  else if (G.scene === 'beach') svg = drawBeach();
  else svg = drawRoad(G.weather);

  // Inject drifting ash into the SVG before closing tag
  return svg.replace('</svg>', drawAsh(700, 260) + '</svg>');
}

function karmaLabel(k) {
  if(k>=80) return 'The fire burns bright';
  if(k>=60) return 'Carrying the fire';
  if(k>=40) return 'Uncertain';
  if(k>=20) return 'The fire dims';
  return 'The fire is going out';
}

function applyDailyDecay() {
  const m = G.man, b = G.boy;
  m.hu = clamp(m.hu - (5 + Math.floor(Math.random()*3)));
  b.hu = clamp(b.hu - (5 + Math.floor(Math.random()*3)));
  m.th = clamp(m.th - (6 + Math.floor(Math.random()*4)));
  b.th = clamp(b.th - (6 + Math.floor(Math.random()*4)));

  // Daily sanity decrease from monotony
  m.sa = clamp(m.sa - (2 + Math.floor(Math.random()*3)));
  b.sa = clamp(b.sa - (2 + Math.floor(Math.random()*3)));

  if(m.hu < 20) m.hp = clamp(m.hp - (5 + Math.floor(Math.random()*3)));
  if(b.hu < 20) b.hp = clamp(b.hp - (5 + Math.floor(Math.random()*3)));
  if(m.th < 15) m.hp = clamp(m.hp - (7 + Math.floor(Math.random()*4)));
  if(b.th < 15) b.hp = clamp(b.hp - (7 + Math.floor(Math.random()*4)));
  if(m.sa < 20) { if(Math.random()>.5) m.hp = clamp(m.hp - (2 + Math.floor(Math.random()*4))); }
  if(b.sa < 20) { if(Math.random()>.5) b.hp = clamp(b.hp - (2 + Math.floor(Math.random()*4))); }
  // weather normalizes
  if(G.weather === 'rain' && Math.random()>.4) G.weather = 'overcast';
  if(G.weather === 'snow' && Math.random()>.35) G.weather = 'overcast';
  if(Math.random()>.85) G.weather = ['overcast','overcast','overcast','rain','snow','clear'][Math.floor(Math.random()*6)];
}

function checkDeath() {
  const md = G.man.hp <= 0, bd = G.boy.hp <= 0;
  if(md || bd) {
    G.over = true;
    G.deathWho = md && bd ? 'both' : md ? 'man' : 'boy';
    return true;
  }
  return false;
}

function pickEvent() {
  // check coast
  if(G.progress >= 100 && !G.reachedCoast) {
    return 'COAST';
  }
  // filter eligible events
  const pool = EVENTS.filter(e => {
    const w = typeof e.weight === 'function' ? e.weight(G) : e.weight;
    if(G.usedEvents.has(e.id) && w < 2) return false;
    if(e.condition && !e.condition(G)) return false;
    if(e.id === G.lastEvent) return false;
    return true;
  });
  if(!pool.length) return EVENTS[Math.floor(Math.random()*EVENTS.length)];
  // weighted pick
  const getWeight = (e) => typeof e.weight === 'function' ? e.weight(G) : e.weight;
  const total = pool.reduce((s, e) => s + getWeight(e), 0);
  let r = Math.random() * total;
  for (const e of pool) {
   r -= getWeight(e);
   if (r <= 0) return e; }
  return pool[pool.length-1];
}

function useSupply(type, who) {
  if(G.over || G.awaitingContinue) return;
  const inv = G.inv;
  const char = who === 'man' ? G.man : G.boy;
  const name = who === 'man' ? 'You' : 'The Boy';

  if(type==='food' && char.hu >= 100) return;
  if(type==='water' && char.th >= 100) return;
  if(type==='medicine' && char.hp >= 100) return;

  if(type==='food' && inv.food > 0) {
    inv.food--;
    char.hu = clamp(char.hu + 32);
    char.hp = clamp(char.hp + 4);
    showStatus(`${name} ate food. Hunger restored.`, 'ok');
    triggerSceneAction('eat', who, 900);
  } else if(type==='water' && inv.water > 0) {
    inv.water--;
    char.th = clamp(char.th + 32);
    char.hp = clamp(char.hp + 2);
    showStatus(`${name} drank water. Thirst restored.`, 'ok');
    triggerSceneAction('drink', who, 900);
  } else if(type==='medicine' && inv.medicine > 0) {
    inv.medicine--;
    char.hp = clamp(char.hp + 45);
    char.sa = clamp(char.sa + 10);
    showStatus(`${name} used medicine. Health restored.`, 'ok');
    triggerSceneAction('meds', who, 900);
  }
  renderStats();
  renderInv();
}

function showStatus(msg, type='') {
  const el = document.getElementById('status-line');
  el.textContent = msg;
  el.className = type==='warn' ? 'status-warn' : type==='ok' ? 'status-ok' : '';
  setTimeout(()=>{ el.textContent=''; el.className=''; }, 3000);
}

// ═══════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════
function renderStats() {
  const set = (id, val) => {
    const n = document.getElementById(id+'-n');
    const b = document.getElementById(id+'-b');
    if(n) n.textContent = Math.max(0,Math.round(val));
    if(b) { b.style.width = pct(val)+'%'; b.classList.toggle('crit', val < 20); }
  };
  set('m-hp', G.man.hp); set('m-hu', G.man.hu);
  set('m-th', G.man.th); set('m-sa', G.man.sa);
  set('b-hp', G.boy.hp); set('b-hu', G.boy.hu);
  set('b-th', G.boy.th); set('b-sa', G.boy.sa);
  document.getElementById('karma-text').textContent = karmaLabel(G.karma);
  // supply buttons
  const f = G.inv.food > 0;
  const w = G.inv.water > 0;
  const m = G.inv.medicine > 0;
  document.getElementById('btn-eat').disabled = !f;
  document.getElementById('btn-drink').disabled = !w;
  document.getElementById('btn-feed').disabled = !f;
  document.getElementById('btn-water-boy').disabled = !w;
  document.getElementById('btn-heal-m').disabled = !m;
  document.getElementById('btn-heal-b').disabled = !m;
  // Blood vignette if man health is low
  if (G.man.hp <= 30) {
    document.body.classList.add('health-low');
  } else {
    document.body.classList.remove('health-low');
  }

}

function renderInv() {
  document.getElementById('i-food').textContent = G.inv.food;
  document.getElementById('i-water').textContent = G.inv.water;
  document.getElementById('i-med').textContent = G.inv.medicine;
  document.getElementById('i-ammo').textContent = G.inv.bullets;
  document.getElementById('i-flare').textContent = G.inv.flare;
  const pf = document.getElementById('prog-bar-fill');
  if(pf) pf.style.width = Math.min(100, G.progress)+'%';
}


function triggerSceneAction(action, target='both', duration=900) {
  if (!G) return;
  if (G.actionTimer) clearTimeout(G.actionTimer);
  G.sceneAction = action;
  G.actionTarget = target;
  renderScene();
  G.actionTimer = setTimeout(() => {
    G.sceneAction = 'idle';
    G.actionTarget = 'both';
    renderScene();
  }, duration);
}

function renderScene() {
  document.getElementById('scene-svg').innerHTML = getSceneSVG();
  document.getElementById('day-badge').textContent = `Day ${G.day}`;
  const wmap = {overcast:'Overcast',rain:'Rain',snow:'Snow',clear:'Clear'};
  document.getElementById('weather-badge').textContent = wmap[G.weather]||'Overcast';
}

function typewrite(el, text, speed=22, cb) {
  if(!el) return null;
  const runId = (el._typeRunId || 0) + 1;
  el._typeRunId = runId;
  if(el._typeTimer) {
    clearInterval(el._typeTimer);
    el._typeTimer = null;
  }
  const finalText = String(text ?? '');
  el.textContent = '';
  let i = 0;
  if(finalText.length === 0) {
    if(cb && el._typeRunId === runId) cb();
    return null;
  }
  el._typeTimer = setInterval(() => {
    if(el._typeRunId !== runId) {
      clearInterval(el._typeTimer);
      el._typeTimer = null;
      return;
    }
    if(i < finalText.length) {
      el.textContent += finalText[i++];
    } else {
      clearInterval(el._typeTimer);
      el._typeTimer = null;
      el.textContent = finalText;
      if(cb && el._typeRunId === runId) cb();
    }
  }, speed);

  el._skipTypewrite = () => {
    if (el._typeTimer && el._typeRunId === runId) {
      clearInterval(el._typeTimer);
      el._typeTimer = null;
      el.textContent = finalText;
      if (cb) cb();
    }
  };

  return el._typeTimer;
}


function scrollNarrativeToTop() {
  const col = document.getElementById('narrative-col');
  if(!col) return;
  col.scrollTop = 0;
  requestAnimationFrame(() => { col.scrollTop = 0; });
  setTimeout(() => { col.scrollTop = 0; }, 0);
}

function resetNarrativePanel() {
  const nt = document.getElementById('narrative-text');
  const rt = document.getElementById('result-text');
  const cl = document.getElementById('choices-list');
  const cb = document.getElementById('continue-btn');
  if(nt && nt._typeTimer) {
    clearInterval(nt._typeTimer);
    nt._typeTimer = null;
  }
  if(nt) nt.textContent = '';
  if(rt) {
    rt.textContent = '';
    rt.style.display = 'none';
  }
  if(cl) {
    cl.innerHTML = '';
    cl.style.display = 'flex';
  }
  if(cb) cb.style.display = 'none';
  scrollNarrativeToTop();
}

function showChoices(event) {
  const panel = document.getElementById('choices-list');
  const nt = document.getElementById('narrative-text');
  if(!panel || !event) return;
  if(nt && nt._typeTimer) {
    clearInterval(nt._typeTimer);
    nt._typeTimer = null;
  }
  if(nt) nt.textContent = String(event.narrative ?? '');
  panel.innerHTML = '';
  panel.style.display = 'flex';
  document.getElementById('continue-btn').style.display = 'none';
  document.getElementById('result-text').style.display = 'none';
  G.awaitingContinue = false;
  scrollNarrativeToTop();

  event.choices.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    let locked = false, lockNote = '';
    if(c.req === 'food' && G.inv.food <= 0) { locked = true; lockNote = '(no food)'; }
    else if(c.req === 'water' && G.inv.water <= 0) { locked = true; lockNote = '(no water)'; }
    else if(c.req === 'medicine' && G.inv.medicine <= 0) { locked = true; lockNote = '(no medicine)'; }
    else if(c.req === 'bullets' && G.inv.bullets <= 0) { locked = true; lockNote = '(no ammo)'; }
    else if(c.req === 'flare' && G.inv.flare <= 0) { locked = true; lockNote = '(no flare)'; }
    else if(c.reqStat) {
      const ch = c.reqStat.char === 'man' ? G.man : G.boy;
      if(ch[c.reqStat.stat] < c.reqStat.min) { locked = true; lockNote = c.reqNote || `(requires ${c.reqStat.stat} ≥ ${c.reqStat.min})`; }
    }
    if(locked) btn.classList.add('locked');
    btn.innerHTML = `${i+1}. ${c.text.replace('food', '🥫 food').replace('water', '💧 water').replace('medicine', '💊 medicine').replace('bullets', '🔫 bullets').replace('pistol', '🔫 pistol')}${locked ? ` <span class="req-note">${lockNote}</span>` : ''}`;
    if(!locked) btn.addEventListener('click', () => makeChoice(event, i));
    panel.appendChild(btn);
  });
}

function makeChoice(event, idx) {
  const choice = event.choices[idx];
  if(!choice) return;

  choice.apply(G);
  G.progress = clamp(G.progress + (event.progress || 3), 0, 100);
  renderStats();
  renderInv();
  renderScene();

  const rt = document.getElementById('result-text');
  const cl = document.getElementById('choices-list');
  let resultText = '';
  try {
    if(typeof choice.result === 'function') resultText = choice.result();
    else resultText = choice.result;
  } catch(e) {
    resultText = choice._r || '';
  }
  if(!resultText && choice._r) resultText = choice._r;
  if(!resultText) resultText = 'You move on down the road.';
  rt.textContent = String(resultText);
  rt.style.display = 'block';
  cl.innerHTML = '';
  cl.style.display = 'flex';
  const cb = document.getElementById('continue-btn');
  cb.style.display = 'block';
  G.awaitingContinue = true;
  scrollNarrativeToTop();

  const warns = [];
  if(G.man.hp < 20) warns.push('The man is dying.');
  if(G.boy.hp < 20) warns.push('The boy is dying.');
  if(G.man.hu < 15) warns.push('The man is starving.');
  if(G.boy.hu < 15) warns.push('The boy is starving.');
  if(G.man.th < 15) warns.push('The man is dehydrated.');
  if(G.boy.th < 15) warns.push('The boy is dehydrated.');
  if(warns.length) showStatus(warns[0], 'warn');

  G.scene = 'road';
}

// ═══════════════════════════════════════════════
//  SCREENS
// ═══════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function nextTurn() {
  if(G.over) return;
  G.day++;
  applyDailyDecay();
  if(checkDeath()) { triggerDeath(); return; }
  if(G.progress >= 100 && !G.reachedCoast) { triggerCoast(); return; }
  const ev = pickEvent();
  if(ev === 'COAST') { triggerCoast(); return; }
  G.lastEvent = ev.id;
  G.usedEvents.add(ev.id);
  if(ev.scene) G.scene = ev.scene; else G.scene = 'road';

  renderScene();
  renderStats();
  renderInv();
  const nt = document.getElementById('narrative-text');
  resetNarrativePanel();
  nt.textContent = String(ev.narrative ?? '');
  scrollNarrativeToTop();
  typewrite(nt, ev.narrative, 20, () => showChoices(ev));
}


function triggerCoast() {
  G.reachedCoast = true;
  G.scene = 'beach';
  renderScene();
  showScreen('cutscene-screen');
  document.getElementById('cutscene-svg-wrap').innerHTML = drawBeach();
  const text = `The coast.

The gray beach, the gray sea, the gray sky. The boy stood beside you looking out at it.

"It's the ocean, Papa."

"Yes."

"It doesn't look like I thought it would."

"No."

The waves came in small and gray and cold. No ships on the water. Nothing on the shore. No warmth in the light at all.

You looked at the boy, the disappointment clearly visible on his face. "I'm sorry it's not blue."

"That's okay," said the boy.

After a bit, "What are we going to do, Papa?"

You didn't have an answer. The fire had to be somewhere. It had to.

You search a beached ship down the shore and find an Orion flare gun.`;
  const el = document.getElementById('cutscene-text');
  typewrite(el, text, 20, () => {
    const btn = document.getElementById('cutscene-btn');
    btn.classList.add('show');
    btn.onclick = () => { showScreen('game-screen'); G.progress = 80; continueAfterCoast(); };
  });
}


function continueAfterCoast() {
  document.getElementById('prog-lbl').textContent = 'Carrying on';
  document.getElementById('prog-bar-bg').style.display = 'none';
  nextTurn();
}

function triggerSecretEnding() {
  showScreen('secret-cutscene-screen');
    document.getElementById('secret-cutscene-svg-wrap').innerHTML = drawBeach();

  const text = `Three days after the man died, the boy had not moved far from the body.

He walked out and looked down the road and he looked back the way they had come.

Then he heard them.

He started to turn and go back but he didn't. He just stood in the road and waited.

A man came around the point of rocks, picking his way carefully. He had a woman with him and two children, a boy and a girl. They stopped when they saw him.

The man knelt down in front of him. He had a beard and his eyes were light-colored and he looked at the boy a long time.

"Are you all right?" he said.

The boy didn't answer.

"Where's the man you were with?"

The boy looked over into the woods. "He died."

"Was that your father?"

"Yes."

The man looked at the woman and then back at the boy.

"I think you should come with me."

"Okay."

He took the boy in his arms and held him. The boy could feel the woman's hand on his back. He was crying but he had no idea when he'd started.

"Is the fire real?" the boy said.

The man pulled back and looked at him.

"Yes," he said. "It is."

"My papa said so."

"Your papa was right."

The boy looked back once down in the trees where the man lay. Then he turned and walked with them down the road into the gray morning.

The fire survived.`;

  const el = document.getElementById('secret-cutscene-text');
  typewrite(el, text, 22, () => {
    const btn = document.getElementById('secret-cutscene-btn');
    btn.classList.add('show');
    btn.onclick = () => showSummary();
  });
}

function triggerDeath() {
  G.over = true;
  showScreen('death-screen');
  const who = G.deathWho;
  const line = who === 'both' ? 'They are both gone.' : who === 'man' ? 'The man has died.' : 'The boy has died.';
  const el = document.getElementById('death-text');
  el.textContent = line;
  setTimeout(() => el.classList.add('show'), 600);

  // Fade to black and then summary
  setTimeout(() => {
    document.getElementById('death-screen').style.opacity = '0';
    setTimeout(() => {
      // CHECK SECRET ENDING CONDITIONS HERE
      const secretEnding = (
        G.deathWho === 'man' &&
        G.boy.hp > 0 &&
        G.reachedCoast &&
        G.arrowShot &&
        G.karma >= 65
      );

      if (secretEnding) {
        triggerSecretEnding();
      } else {
       showSummary();
       document.getElementById('summary-screen').style.opacity = '0';
       document.getElementById('summary-screen').style.transition = 'opacity 2s';
       setTimeout(() => { document.getElementById('summary-screen').style.opacity = '1'; }, 100);
      }
    }, 2000);
  }, 4200);
}

function showSummary() {
  showScreen('summary-screen');
  const who = G.deathWho;
  const survived = who === 'man' ? 'The boy' : who === 'boy' ? 'The man' : 'Neither';
  const k = G.karma;

  document.getElementById('sum-stats').innerHTML = `
    <div class="sum-row"><span class="sum-key">Days survived</span><span class="sum-val">${G.day}</span></div>
    <div class="sum-row"><span class="sum-key">Reached the coast</span><span class="sum-val">${G.reachedCoast ? 'Yes' : 'No'}</span></div>
    <div class="sum-row"><span class="sum-key">Survived</span><span class="sum-val">${survived}</span></div>
    <div class="sum-row"><span class="sum-key">Karma</span><span class="sum-val">${k} — ${karmaLabel(k)}</span></div>
    <div class="sum-row"><span class="sum-key">Man's final health</span><span class="sum-val">${Math.max(0,Math.round(G.man.hp))}</span></div>
    <div class="sum-row"><span class="sum-key">Boy's final health</span><span class="sum-val">${Math.max(0,Math.round(G.boy.hp))}</span></div>
  `;

  let ending = '';
  if(who === 'both') {
    ending = `They walked until they could not walk any further. What they carried they carried to the end.\n\nThe fire went out.`;
  } else if(who === 'boy') {
    ending = `He tried to be good. He tried to carry the fire.\n\nIn the end, the road was too long.`;
  } else if(who === 'man') {
    if(G.reachedCoast && G.boy.hp > 0 && k >= 65 && G.arrowShot === true) {
      ending = `He carried the fire as far as he could. And at the last, it was enough.`;
    } else {
      ending = `He did what he could. More, perhaps, than could have been asked of him.\n\nThe boy goes on alone.\n\nThe fire may yet survive.`;
    }
  }
  document.getElementById('ending-text').textContent = ending;
}

// ═══════════════════════════════════════════════
//  ASH PARTICLES
// ═══════════════════════════════════════════════
const canvas = document.createElement('canvas');
canvas.id = 'ash-canvas';
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
let w, h;
const particles = [];
function resizeCanvas() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

for(let i=0; i<150; i++) {
  particles.push({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.5 + 0.5,
    d: Math.random() * 100,
    vx: Math.random() * 0.5 - 0.25,
    vy: Math.random() * 1 + 0.5
  });
}

function drawAsh() {
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = 'rgba(180, 180, 180, 0.7)';
  ctx.beginPath();
  for(let i=0; i<particles.length; i++) {
    const p = particles[i];
    ctx.moveTo(p.x, p.y);
    ctx.arc(p.x, p.y, p.r, 0, Math.PI*2, true);
  }
  ctx.fill();
  updateAsh();
  requestAnimationFrame(drawAsh);
}

function updateAsh() {
  let angle = 0;
  for(let i=0; i<particles.length; i++) {
    const p = particles[i];
    angle += 0.01;
    p.y += Math.cos(angle + p.d) + p.vy;
    p.x += Math.sin(angle) * 1 + p.vx;

    // weather effects
    if(typeof G !== 'undefined') {
        if(G.weather === 'snow') {
            p.y += 2; // faster fall
            p.r = Math.max(p.r, 2); // bigger flakes
        } else if(G.weather === 'rain') {
            p.y += 6; 
            p.x += 1;
        }
    }

    if(p.x > w + 5 || p.x < -5 || p.y > h) {
      if(i%3 > 0) {
        particles[i] = {x: Math.random()*w, y: -10, r: p.r, d: p.d, vx: p.vx, vy: p.vy};
      } else {
        if(Math.sin(angle) > 0) {
          particles[i] = {x: -5, y: Math.random()*h, r: p.r, d: p.d, vx: p.vx, vy: p.vy};
        } else {
          particles[i] = {x: w+5, y: Math.random()*h, r: p.r, d: p.d, vx: p.vx, vy: p.vy};
        }
      }
    }
  }
}
drawAsh();
